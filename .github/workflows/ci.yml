name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck g++
      - name: Install native client test dependencies
        run: python3 -m pip install ./packages/device
      - run: bash -n setup.sh scripts/doctor.sh
      - run: shellcheck setup.sh scripts/doctor.sh
      - run: python3 -m unittest discover -s tests -v
