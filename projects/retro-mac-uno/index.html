<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Macintosh</title>
<style>
html,body { margin:0; width:100%; height:100%; background:#222; color:white; font:14px system-ui; cursor:none; }
body { display:grid; place-items:center; overflow:hidden; }
#stage { width:min(100vw, 133.333vh); }
canvas { width:100%; image-rendering:pixelated; cursor:none; }
#status { position:fixed; bottom:0; left:0; background:#222; }
</style>
<div id="stage"></div><div id="status">Starting Macintosh…</div>
<script src="/mac/mac-runtime.js"></script>
<script>
const status = document.getElementById('status');
function closeKiosk() {
  fetch('/__shutdown', {method: 'POST', headers: {'X-Little-Macintosh': 'shutdown'}})
    .then(response => { if (!response.ok) throw new Error('Launcher unavailable'); })
    .catch(() => { status.textContent = 'Close this window to exit.'; });
}
const systems = {
  'system-7': {machine: 'iifx', disk: 'system-7.5.3', ram: 32},
  'mac-os-8.0': {machine: 'quadra', disk: 'macos-8.0', extraDisks: ['torque-macpaint-apps'], ram: 64},
  'mac-os-8.5': {machine: '9500', disk: 'macos-8.5', ram: 128},
};
const system = systems[new URLSearchParams(location.search).get('system')] || systems['system-7'];
const mac = MacEmulator.create({
  parent: document.getElementById('stage'), machine: system.machine,
  disks: [system.disk, ...(system.extraDisks || [])], screen: system.screen || {width: 640, height: 480}, ramMB: system.ram,
  pixelated: true, serviceWorker: {scope: '/'},
  onQuiescent() { status.textContent = ''; },
  onError(message) { status.textContent = 'Macintosh error: ' + message; },
  onExit() {
    status.textContent = 'Macintosh shut down.';
    closeKiosk();
  },
});
</script>
</html>
