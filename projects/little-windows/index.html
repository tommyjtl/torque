<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Windows</title>
<style>
html, body { margin:0; width:100%; height:100%; background:#000; color:#fff; overflow:hidden; font:14px sans-serif; }
body { display:grid; place-items:center; }
#screen { max-width:100vw; max-height:100vh; overflow:hidden; }
#screen canvas { max-width:100vw; max-height:100vh; image-rendering:pixelated; }
#status { position:fixed; left:0; bottom:0; background:#222; }
</style>
<div id="screen"><div style="white-space:pre;font:14px monospace;line-height:14px"></div><canvas style="display:none"></canvas></div>
<div id="status">Starting Windows…</div>
<script src="/build/libv86.js"></script>
<script>
const profile = {memory:64, path:'windows95-v3', size:471859200, state:'/images/windows95-local-640.zst'};
const status = document.getElementById('status');
const emulator = new V86({
  wasm_path:'/build/v86.wasm',
  screen_container:document.getElementById('screen'),
  memory_size:profile.memory * 1024 * 1024,
  vga_memory_size:8 * 1024 * 1024,
  bios:{url:'/bios/seabios.bin'}, vga_bios:{url:'/bios/vgabios.bin'},
  hda:{url:`/images/${profile.path}/.img`, size:profile.size, async:true, fixed_chunk_size:262144, use_parts:true},
  ...(profile.state ? {initial_state:{url:profile.state}} : {}),
  autostart:true,
});
emulator.add_listener('screen-set-size', () => { status.textContent = ''; });
emulator.add_listener('download-error', () => { status.textContent = 'Could not load Windows data; check the network connection.'; });
</script>
</html>
